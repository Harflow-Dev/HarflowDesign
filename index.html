<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harflow design</title>
<link rel="icon" type="image/png" sizes="32x32" href="v2/assets/branding/app-icon-32.png">
<script>
// Root redirector. tests/redirector.test.mjs runs this script against a model of the host.
// Hosting serves this page, with status 200, for any path that does not exist, so a served
// path other than "/" and "/index.html" is a missing path. Targets are root-absolute when
// served and relative under file://.
(function () {
  var MOVED = {
    '/v2/docs/approval.md': '/v2/docs/decisions/approval.md',
    '/v2/docs/d2b-observation-approval.md': '/v2/docs/decisions/d2b-observation-approval.md',
    '/v2/docs/d2b-observation-proposal.md': '/v2/docs/decisions/d2b-observation-proposal.md',
    '/v2/docs/m04-proposal.md': '/v2/docs/decisions/m04-proposal.md',
    '/v2/docs/m04-centered-composer-proposal.md': '/v2/docs/decisions/m04-centered-composer-proposal.md',
    '/v2/docs/m05-task-screen-approval.md': '/v2/docs/decisions/m05-task-screen-approval.md',
    '/v2/docs/m05-task-screen-proposal.md': '/v2/docs/decisions/m05-task-screen-proposal.md'
  };
  var loc = window.location;
  var served = loc.protocol === 'http:' || loc.protocol === 'https:';
  var hash = loc.hash && loc.hash !== '#' ? loc.hash : '';
  var target = null;
  if (!served) {
    target = hash ? 'archive/v1/index.html' + hash : 'v2/index.html';
  } else if (loc.pathname === '/' || loc.pathname === '/index.html') {
    target = hash ? '/archive/v1/index.html' + hash : '/v2/index.html';
  } else if (/^\/(archive|v2)(\/|$)/.test(loc.pathname)) {
    // A missing path inside the sites is never redirected again; only the moved documents are.
    if (Object.prototype.hasOwnProperty.call(MOVED, loc.pathname)) target = MOVED[loc.pathname] + loc.search + loc.hash;
  } else {
    // A moved v1 path (features, scripts, styles, assets, documents).
    target = '/archive/v1' + loc.pathname + loc.search + loc.hash;
  }
  if (target) { loc.replace(target); return; }
  // Nothing to redirect to: show the links, root-absolute when served.
  document.addEventListener('DOMContentLoaded', function () {
    if (!served) return;
    var links = document.querySelectorAll('a[data-root-link]');
    for (var i = 0; i < links.length; i += 1) links[i].setAttribute('href', '/' + links[i].getAttribute('data-root-link'));
  });
})();
</script>
</head>
<body>

<p>Harflow design reference (JavaScript is needed to open the links from a file).</p>

</ul>

</body>
</html>
