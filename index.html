// Root redirector. Relative targets keep it working under file://.
(function () {
  var loc = window.location;
  var path = loc.pathname;
  var served = loc.protocol === 'http:' || loc.protocol === 'https:';
  // Hosting serves this page, with status 200, for any path that does not exist.
  // Old v1 paths (features, scripts, styles, assets, docs) move to archive/v1.
  var atRoot = !served || path === '/' || /\/index\.html$/.test(path) || /\/$/.test(path);
  var inSite = /^\/(archive|v2)(\/|$)/.test(path);
  if (served && !atRoot && !inSite) {
    loc.replace('/archive/v1' + path + loc.search + loc.hash);
    return;
  }
  if (!atRoot) return;
  if (loc.hash && loc.hash !== '#') loc.replace('archive/v1/index.html' + loc.hash);
  else loc.replace('v2/index.html');
})();
</script>
