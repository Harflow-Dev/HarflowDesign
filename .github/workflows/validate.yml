name: Validate design catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          for file in scripts/*.js features/*.js; do node --check "$file"; done
      - name: Run standalone catalog tests
        # Native source provenance is checked locally with the sibling HarflowMac checkout.
        run: node --test --test-skip-pattern='^registry source links resolve in the pinned HarflowMac tree$' tests/catalog.test.mjs
      - name: Stage public site
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R scripts styles assets docs features dist/
